name: Feature request
description: Suggest a check, an allowlisted command or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, ideally with a real README or workflow, rather than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like RepoProof to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: help
    attributes:
      label: Would you like to work on it?
      options:
        - "Yes, with some guidance"
        - "Yes, on my own"
        - "No, I am just suggesting it"
