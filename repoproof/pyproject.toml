[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repoproof"
dynamic = ["version"]
description = "Prove that your repository's setup instructions actually work."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "RepoProof contributors" }]
keywords = [
  "documentation",
  "readme",
  "onboarding",
  "ci",
  "github-actions",
  "developer-tools",
  "sarif",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ['tomli>=2.0.1; python_version < "3.11"']

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/devXyi/repoproof"
Documentation = "https://github.com/devXyi/repoproof/tree/main/docs"
Issues = "https://github.com/devXyi/repoproof/issues"
Changelog = "https://github.com/devXyi/repoproof/blob/main/CHANGELOG.md"

[project.scripts]
repoproof = "repoproof.cli:main"

[tool.setuptools.dynamic]
version = { attr = "repoproof.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
