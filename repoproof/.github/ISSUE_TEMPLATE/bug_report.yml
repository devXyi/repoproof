name: Bug report
description: RepoProof did something wrong, or something confusing
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. False positives (a finding that is wrong) and false
        negatives (a problem it missed) are both bugs. Please remove secrets and private paths.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you run, what did you expect and what did you get?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest README snippet, `repoproof.toml` and command that shows the problem.
      render: markdown
  - type: textarea
    id: report
    attributes:
      label: Output
      description: The relevant part of `repoproof check --format json`, or the text report.
      render: text
  - type: input
    id: version
    attributes:
      label: RepoProof version
      description: The output of `repoproof --version`.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system, Python version, and whether this ran locally or in GitHub Actions.
      placeholder: Ubuntu 24.04, Python 3.12, GitHub Actions
    validations:
      required: true
