name: RepoProof
description: Verify that a repository's documented setup, build and test instructions actually work.
author: RepoProof contributors
branding:
  icon: check-circle
  color: green

inputs:
  path:
    description: Repository directory to verify, relative to the workspace.
    default: "."
  config:
    description: Path to a repoproof.toml. Defaults to the one inside `path`.
    default: ""
  only:
    description: "Comma-separated subset of checks to run: commands, links, env."
    default: ""
  fail-on:
    description: "Severity that fails the step: error, warning, note or never."
    default: error
  network:
    description: "Network policy for documented commands: deny, install or allow. Empty uses the configuration file."
    default: ""
  comment:
    description: "Pull request comment: on-failure, always or never."
    default: on-failure
  github-token:
    description: Token used to post the pull request comment.
    default: ${{ github.token }}
  json-file:
    description: Also write the JSON report to this path.
    default: ""
  sarif-file:
    description: Also write the SARIF report to this path.
    default: ""
  python:
    description: Python interpreter (3.10 or newer) used to run RepoProof.
    default: python3
  extra-args:
    description: Extra arguments for `repoproof check`, split on whitespace.
    default: ""

runs:
  using: composite
  steps:
    - name: Install RepoProof
      shell: bash
      env:
        REPOPROOF_PYTHON: ${{ inputs.python }}
        REPOPROOF_SOURCE: ${{ github.action_path }}
      run: |
        set -euo pipefail
        venv="$RUNNER_TEMP/repoproof-venv"
        "$REPOPROOF_PYTHON" -m venv "$venv"
        "$venv/bin/python" -m pip install --quiet --disable-pip-version-check "$REPOPROOF_SOURCE"

    - name: Verify the documented setup
      shell: bash
      env:
        RP_PATH: ${{ inputs.path }}
        RP_CONFIG: ${{ inputs.config }}
        RP_ONLY: ${{ inputs.only }}
        RP_FAIL_ON: ${{ inputs.fail-on }}
        RP_NETWORK: ${{ inputs.network }}
        RP_COMMENT: ${{ inputs.comment }}
        RP_JSON: ${{ inputs.json-file }}
        RP_SARIF: ${{ inputs.sarif-file }}
        RP_EXTRA: ${{ inputs.extra-args }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        set -uo pipefail
        args=(check "$RP_PATH" --fail-on "$RP_FAIL_ON")
        if [ -n "$RP_CONFIG" ]; then args+=(--config "$RP_CONFIG"); fi
        if [ -n "$RP_ONLY" ]; then args+=(--only "$RP_ONLY"); fi
        if [ -n "$RP_NETWORK" ]; then args+=(--network "$RP_NETWORK"); fi
        if [ -n "$RP_JSON" ]; then args+=(--json "$RP_JSON"); fi
        if [ -n "$RP_SARIF" ]; then args+=(--sarif "$RP_SARIF"); fi
        if [ "$RP_COMMENT" != "never" ] && [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
          args+=(--github-comment "$RP_COMMENT")
        fi
        if [ -n "$RP_EXTRA" ]; then
          read -r -a extra <<< "$RP_EXTRA"
          args+=("${extra[@]}")
        fi
        exec "$RUNNER_TEMP/repoproof-venv/bin/repoproof" "${args[@]}"
