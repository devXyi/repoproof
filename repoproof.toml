# RepoProof verifies its own README. See docs/configuration.md for every key.
version = 1

[repoproof]
docs = ["README.md"]

# The README tells users to install the published package; verify this checkout instead.
[[commands.rewrite]]
match = "pipx install repoproof"
run = "pip install ."

# Running a real check from inside a check is refused, so the quickstart's `check .` is
# verified as a dry run, which proves the command exists and the configuration loads.
[[commands.rewrite]]
match = "repoproof check ."
run = "repoproof check . --dry-run"

[env]
# The bundled demo project reads variables on purpose.
exclude = ["examples/*"]
